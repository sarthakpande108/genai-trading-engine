name: Node.js CI

on:
  push:
    branches: [main, "feat/**", "fix/**"]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies and synchronize lockfile
        run: npm install --ignore-scripts
      - name: Verify clean install
        run: npm ci --ignore-scripts
      - name: Apply Neon migrations using a direct connection
        env:
          DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
        run: |
          if [ -z "$DATABASE_URL_UNPOOLED" ]; then
            echo "::warning::DATABASE_URL_UNPOOLED is not configured; Neon migrations must already be applied."
            exit 0
          fi
          npm run db:migrate
      - name: Run unit and Neon integration tests
        env:
          TEST_DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npm test
      - name: Run Neon PostgreSQL smoke test
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::warning::DATABASE_URL is not configured; skipping Neon integration smoke test."
            exit 0
          fi
          npm run db:smoke
