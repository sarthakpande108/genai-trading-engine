name: Live Market + Gemini Validation

on:
  workflow_dispatch:
    inputs:
      symbols:
        description: "Comma-separated NSE symbols (maximum 4)"
        required: true
        default: RELIANCE

permissions:
  contents: read

jobs:
  validate-live:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Run automated tests
        run: npm test
      - name: Validate required credentials
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
          ANGEL_API_KEY: ${{ secrets.ANGEL_API_KEY }}
          ANGEL_CLIENT_CODE: ${{ secrets.ANGEL_CLIENT_CODE }}
          ANGEL_MPIN: ${{ secrets.ANGEL_MPIN }}
          ANGEL_TOTP_SECRET: ${{ secrets.ANGEL_TOTP_SECRET }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          missing=0
          for name in DATABASE_URL DATABASE_URL_UNPOOLED ANGEL_API_KEY ANGEL_CLIENT_CODE ANGEL_MPIN ANGEL_TOTP_SECRET GEMINI_API_KEY; do
            if [ -z "${!name}" ]; then echo "::error::Missing repository secret: $name"; missing=1; fi
          done
          if [ "$missing" -ne 0 ]; then exit 1; fi
      - name: Apply database migrations
        env:
          DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
        run: npm run db:migrate
      - name: Run real Angel One + Gemini validation
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ANGEL_API_KEY: ${{ secrets.ANGEL_API_KEY }}
          ANGEL_CLIENT_CODE: ${{ secrets.ANGEL_CLIENT_CODE }}
          ANGEL_MPIN: ${{ secrets.ANGEL_MPIN }}
          ANGEL_TOTP_SECRET: ${{ secrets.ANGEL_TOTP_SECRET }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-3.8-flash' }}
          VALIDATION_SYMBOLS: ${{ inputs.symbols }}
        run: npm run validate:live
